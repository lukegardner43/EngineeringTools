<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tool - Engineering Tools</title>
<!-- Fonts: distinctive technical pairing, system fallback for offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Paste the contents of assets/theme.css here (single-file tools embed their CSS).
   Below are only the page-specific layout rules that sit on top of the tokens. */

/* >>> THEME TOKENS + BASE COMPONENTS GO HERE (see assets/theme.css) <<< */

.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 56px);}
.col-l{padding:16px;border-right:1px solid var(--bdr);overflow-y:auto;}
.col-r{padding:16px;overflow-y:auto;}
.field{margin-bottom:10px;}
@media(max-width:820px){.layout{grid-template-columns:1fr;}.col-l{border-right:none;border-bottom:1px solid var(--bdr);}}
</style>
</head>
<body>

<header class="et-header">
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="index.html" class="et-home">&#8592; Home</a>
    <div>
      <div class="et-logo">EC2 <em>New Tool</em></div>
      <div class="et-sub">SHORT STANDARD STRAPLINE</div>
    </div>
  </div>
  <div class="et-meta">EN 1992-1-1<br><b>UK NA</b></div>
</header>

<div class="layout">
  <div class="col-l">
    <div class="et-card">
      <div class="et-card-title">Inputs</div>
      <div class="et-field"><label>Example value</label><input class="et-input" type="number" value="0"></div>
    </div>
    <button class="et-btn et-btn-primary">Run Calculation</button>
  </div>
  <div class="col-r">
    <!-- SVG engineering drawings go inside an .et-sheet (light viewport) -->
    <div class="et-sheet"><!-- <svg ...> ink-line drawing on white --></div>
    <!-- Results: verdict banner, summary tiles, expandable check rows -->
  </div>
</div>

</body>
</html>
