<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P358 Steel Joint Design Tool</title>
<style>
:root{
  --bg:#0e1014; --surf:#16191f; --surf2:#1c2027; --bdr:#2a2f38; --bdr2:#3a4250;
  --txt:#e6e8ec; --mut:#8b93a0; --faint:#59616d;
  --accent:#ffb000; --accent-dim:#3a2e12;
  --pass:#3ecf8e; --warn:#ffb000; --fail:#ff5d5d;
  --r:2px;
  --sans:'Saira',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;
  background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:32px 32px;}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bdr);padding:0 20px;height:56px;
  display:flex;align-items:center;justify-content:space-between;}
.logo{font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--txt);}
.logo em{color:var(--accent);font-style:normal;}
.logo-sub{color:var(--faint);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;font-family:var(--mono);}
.hdr-meta{text-align:right;color:var(--mut);font-size:10px;line-height:1.7;font-family:var(--mono);letter-spacing:.4px;}
.hdr-meta b{color:var(--accent);font-weight:500;}
.home-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--mut);text-decoration:none;transition:color .15s;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
.home-btn:hover{color:var(--accent);}
.home-btn svg{width:12px;height:12px;}

/* ── JOINT SELECTOR BAR ── */
.jt-bar{background:var(--bg);border-bottom:1px solid var(--bdr);padding:10px 16px 0;overflow-x:auto;}
.jt-inner{display:flex;gap:6px;min-width:max-content;padding-bottom:10px;}
.jt-card{display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;
  padding:8px 6px 7px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--bdr);background:var(--surf);
  transition:border-color .15s,background .15s;user-select:none;}
.jt-card:hover:not(.locked){border-color:var(--bdr2);background:var(--surf2);}
.jt-card.active{border-color:var(--accent);background:var(--surf);box-shadow:inset 0 0 0 1px var(--accent);}
.jt-card.locked{opacity:.35;cursor:not-allowed;}
.jt-icon{width:70px;height:48px;display:flex;align-items:center;justify-content:center;}
.jt-icon svg{width:100%;height:100%;}
.jt-name{font-size:9.5px;font-weight:500;text-align:center;color:var(--mut);line-height:1.3;}
.jt-card.active .jt-name{color:var(--txt);font-weight:600;}
.jt-tag{font-size:9px;letter-spacing:.6px;padding:1px 6px;border-radius:var(--r);font-family:var(--mono);text-transform:uppercase;}
.tag-done{background:var(--surf2);color:var(--mut);border:1px solid var(--bdr);}
.tag-soon{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 108px);}
.col-l{padding:16px;border-right:1px solid var(--bdr);overflow-y:auto;background:var(--bg);}
.col-r{padding:16px;overflow-y:auto;background:var(--bg);}

/* ── CARDS & FORMS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;}
.card-title{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr);}
.field{margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;color:var(--mut);font-size:11.5px;font-weight:500;margin-bottom:4px;}
.field label em{color:var(--faint);font-weight:400;font-size:10.5px;font-style:normal;font-family:var(--mono);}
.iw{position:relative;}
.iw input,.iw select{width:100%;height:32px;background:var(--surf2);border:1px solid var(--bdr2);
  border-radius:var(--r);padding:0 34px 0 8px;color:var(--txt);font-size:13px;
  font-family:var(--mono);outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;}
.iw input:focus,.iw select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
.iw select option{background:var(--surf);color:var(--txt);}
.iw .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--faint);font-size:10px;pointer-events:none;font-family:var(--mono);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g2 .field,.g3 .field{margin-bottom:0;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.ibox{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);
  padding:7px 10px;font-size:11px;color:var(--mut);font-family:var(--mono);
  margin-top:9px;line-height:1.8;}

/* ── BUTTONS ── */
.btn-calc{width:100%;background:var(--accent);color:#1a1208;border:none;border-radius:var(--r);
  padding:10px;font-size:13px;font-weight:700;font-family:var(--sans);letter-spacing:.8px;text-transform:uppercase;
  cursor:pointer;margin-top:4px;transition:filter .15s,transform .05s;}
.btn-calc:hover{filter:brightness(1.08);}
.btn-calc:active{transform:translateY(1px);}
.btn-sm{background:var(--surf2);color:var(--mut);border:1px solid var(--bdr2);
  border-radius:var(--r);padding:6px 14px;font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--mono);}
.btn-sm:hover{color:var(--txt);border-color:var(--accent);}
.pdf-btn{width:100%;padding:9px;background:var(--surf2);border:1px solid var(--bdr2);border-radius:var(--r);font-size:12px;font-weight:500;color:var(--mut);cursor:pointer;transition:all .15s;margin-bottom:12px;font-family:var(--mono);letter-spacing:.4px;}
.pdf-btn:hover{background:var(--surf);border-color:var(--accent);color:var(--accent);}
.err{background:rgba(255,93,93,.1);border:1px solid var(--fail);border-radius:var(--r);
  padding:9px 13px;color:var(--fail);font-size:12px;margin-bottom:10px;}

/* ── DIAGRAM PANEL ── (drawing sheet kept light for legibility + parity with PDF) */
.diag-panel{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0;}
.diag-title{font-weight:700;font-size:16px;color:var(--txt);letter-spacing:.3px;text-transform:uppercase;}
.diag-desc{font-size:12px;color:var(--mut);text-align:center;max-width:380px;line-height:1.7;}
.diag-wrap{background:#fff;border:1px solid var(--bdr2);border-radius:var(--r);padding:16px;width:100%;}
.diag-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:11px;color:var(--mut);font-family:var(--mono);}
.leg{display:flex;align-items:center;gap:5px;}
.leg-sw{width:14px;height:10px;border-radius:1px;}

/* ── RESULTS ── */
.rhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.rhdr-t{font-weight:700;font-size:17px;color:var(--txt);letter-spacing:.3px;text-transform:uppercase;}
.verdict{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;}
.verdict.pass{background:rgba(62,207,142,.1);border:1px solid var(--pass);}
.verdict.fail{background:rgba(255,93,93,.1);border:1px solid var(--fail);}
.v-lbl{font-weight:700;font-size:16px;letter-spacing:.2px;}
.verdict.pass .v-lbl{color:var(--pass);}
.verdict.fail .v-lbl{color:var(--fail);}
.v-sub{color:var(--mut);font-size:11px;margin-top:3px;}
.v-util{text-align:right;}
.v-util-lbl{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
.v-util-val{font-family:var(--mono);font-size:22px;font-weight:700;}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-bottom:12px;}
.si{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 10px;}
.si-k{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-family:var(--mono);}
.si-v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:2px;color:var(--txt);}
.slbl{font-weight:600;font-size:11px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);
  margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--bdr);}
.slbl:first-child{margin-top:0;}

/* ── CHECK ROWS ── */
.cr{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:5px;overflow:hidden;}
.cr.pass{border-left:3px solid var(--pass);}
.cr.fail{border-left:3px solid var(--fail);}
.crh{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none;}
.crh:hover{background:var(--surf2);}
.cr-n{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:18px;font-weight:600;}
.cr-name{font-size:13px;font-weight:500;flex:1;min-width:0;color:var(--txt);}
.cr-bw{min-width:70px;text-align:right;}
.cr-dvc{font-size:10px;color:var(--mut);font-family:var(--mono);}
.cr-trk{height:3px;background:var(--bdr2);border-radius:2px;overflow:hidden;margin-top:3px;}
.cr-fill{height:100%;border-radius:2px;transition:width .4s;}
.cr-pct{font-family:var(--mono);font-size:12px;font-weight:700;min-width:44px;text-align:right;}
.cr-badge{font-size:10px;font-weight:700;letter-spacing:.8px;padding:2px 8px;border-radius:var(--r);min-width:40px;text-align:center;font-family:var(--mono);}
.bp{background:rgba(62,207,142,.14);color:var(--pass);}
.bf{background:rgba(255,93,93,.14);color:var(--fail);}
.cr-arr{color:var(--faint);font-size:11px;margin-left:2px;}
.crd{padding:0 12px 12px;border-top:1px solid var(--bdr);display:none;background:var(--surf2);}
.crd.open{display:block;}
.dref{display:inline-block;background:var(--bg);border-radius:var(--r);padding:2px 8px;
  font-size:11px;color:var(--mut);font-family:var(--mono);margin:8px 0 6px;border:1px solid var(--bdr);}
.dcalc{background:var(--bg);border-radius:var(--r);padding:10px;border:1px solid var(--bdr);}
.dline{font-family:var(--mono);font-size:11.5px;padding:2.5px 0;color:var(--mut);}
.dline+.dline{border-top:1px solid var(--bdr);}
.dres{display:flex;justify-content:flex-end;align-items:center;gap:10px;
  margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr);}
.dres-l{color:var(--mut);font-size:11px;}
.dres-v{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--txt);}
.notes{background:var(--accent-dim);border:1px solid var(--bdr2);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:12px;color:var(--mut);font-size:11px;line-height:1.9;margin-top:12px;}
.notes b{color:var(--accent);}

@media(max-width:820px){
  .layout{grid-template-columns:1fr;}
  .col-l{border-right:none;border-bottom:1px solid var(--bdr);}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
.print-hdr{display:none;}
@media print{
  .no-print{display:none!important;}
  .jt-bar{display:none!important;}
  .col-l{display:none!important;}
  .layout{display:block!important;}
  .col-r{background:#fff!important;padding:0!important;}
  body{background:#fff!important;font-size:11px;}
  .card,.cr,.verdict,.notes,.si,.diag-wrap{border:1px solid #d4d0ca!important;border-radius:4px!important;}
  .crd{display:block!important;}
  .print-hdr{display:flex!important;justify-content:space-between;align-items:center;
    background:#1a1a1a;color:#fff;padding:10px 16px;margin-bottom:16px;}
  .print-hdr-title{font-size:12pt;font-weight:700;color:#fff;}
  .print-hdr-sub{font-size:8pt;color:#bbb;}
}
</style>

<body>

<header class="hdr no-print">
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="index.html" class="home-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Home</a>
    <div>
      <div class="logo">P358 <em>Connections</em></div>
      <div class="logo-sub">SIMPLE JOINTS TO EUROCODE 3, UK NA</div>
    </div>
  </div>
  <div class="hdr-meta">SCI P358 / EN 1993-1-8<br><b>&gamma;M0 1.00 &nbsp; &gamma;M2 1.25</b></div>
</header>
<div class="print-hdr">
  <div>
    <div class="print-hdr-title">P358 Steel Joint Design</div>
    <div class="print-hdr-sub">SCI P358 · EN 1993-1-8 · EN 1993-1-1 · UK NA · γM0 = 1.00, γM2 = 1.25</div>
  </div>
</div>

<div class="jt-bar no-print"><div class="jt-inner" id="jt-bar"></div></div>

<div class="layout">
  <div class="col-l">
    <div class="card">
      <div class="card-title">Project Info</div>
      <div class="g2">
        <div class="field"><label>Project</label><div class="iw"><input type="text" id="proj-name" placeholder="e.g. Office Block"></div></div>
        <div class="field"><label>Reference</label><div class="iw"><input type="text" id="proj-ref" placeholder="24-123-ST01"></div></div>
        <div class="field"><label>Engineer</label><div class="iw"><input type="text" id="proj-eng" placeholder="Initials"></div></div>
        <div class="field"><label>Date</label><div class="iw"><input type="date" id="proj-date"></div></div>
      </div>
    </div>
    <div id="input-panel"></div>
    <div id="err-box" class="err" style="display:none"></div>
    <button class="btn-calc" onclick="doCalc()">Run Design Calculations</button>
    <button class="pdf-btn" id="rpt-btn" onclick="startPDF(this)" style="display:none">Export calculation report (PDF)</button>
  </div>
  <div class="col-r">
    <div id="diag-area"></div>
    <div id="results" style="display:none"></div>
  </div>
</div>

<script id="joints-engine">
/* ===== SIMPLE JOINTS ENGINE (EngineeringTools ConnectionCheck) =====
   Pure functions, BS EN 1993-1-8 + UK NA (and BS EN 1992-1-1 / BS EN 1992-4 for the concrete side), organised as the
   SCI P358 check lists: detailing (ductility), supporting-element checks, structural integrity (tying) for fin plates and
   end plates, column base plates (6.2.5 effective area, 6.2.8 / Table 6.7 bending, anchor bolts with concrete cone and
   pull-out to EN 1992-4) and bolted end-plate tension splices of RHS / SHS (T-stubs, 6.2.4).
   Units: N, mm. Results are check objects { id, name, ref, lines, cap, dem, unit } (cap and dem in the stated unit). */
const Joints = (() => {
  'use strict';
  const GM0 = 1.0, GM2 = 1.25, GMU = 1.1, GM2S = 1.1;      // UK NA: gamma_Mu = 1.1 for tying; 1.1 for net-section fracture (EN 1993-1-1 UK NA)
  // BS EN 10025-2: fy by thickness; fu = lower bound for 3 <= t <= 100 mm (UK NA: lowest value of the range)
  const GR = { S275: { fy: [[16, 275], [40, 265], [63, 255], [80, 245], [100, 235]], fu: 410, bw: 0.85 },
               S355: { fy: [[16, 355], [40, 345], [63, 335], [80, 325], [100, 315]], fu: 470, bw: 0.90 } };
  function mat(grade, t) {
    const g = GR[grade]; if (!g) throw new Error('Unknown grade ' + grade);
    const fy = (g.fy.find(([lim]) => t <= lim) || [0, NaN])[1];
    if (!Number.isFinite(fy)) throw new Error(`${grade}: thickness ${t} mm outside BS EN 10025-2`);
    return { grade, fy, fu: g.fu, bw: g.bw };
  }
  const BOLTS = { M12: { d: 12, d0: 13, As: 84.3 }, M16: { d: 16, d0: 18, As: 157 }, M20: { d: 20, d0: 22, As: 245 }, M24: { d: 24, d0: 26, As: 353 },
                  M27: { d: 27, d0: 30, As: 459 }, M30: { d: 30, d0: 33, As: 561 }, M36: { d: 36, d0: 39, As: 817 } };
  const FUB = { '4.6': 400, '8.8': 800, '10.9': 1000 };
  const bolt = (size, cls = '8.8') => { const b = BOLTS[size]; if (!b) throw new Error('Unknown bolt ' + size); return { ...b, size, cls, fub: FUB[cls], av: cls === '10.9' ? 0.5 : 0.6 }; };
  const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, kN = v => r1(v / 1e3);
  const chk = (id, name, ref, lines, cap, dem, unit) => ({ id, name, ref, lines, cap, dem, unit });

  // ---------- T-stub in tension, 6.2.4 (Table 6.2): leff for modes 1 and 2, m, n (n <= 1.25 m), sum of bolt resistances ----------
  // prying: false when the bolt elongation length exceeds L_b* (anchor bolts), Table 6.2 "no prying forces"
  function tstub({ leff1, leff2, tf, f, m, n, Ft, nb, gm = GM0, prying = true, ew = 0 }) {
    const Mpl1 = 0.25 * leff1 * tf * tf * f / gm, Mpl2 = 0.25 * leff2 * tf * tf * f / gm, sFt = nb * Ft;
    const nn = Math.min(n, 1.25 * m);
    let F1, F2;
    if (prying) {
      F1 = ew > 0 ? (8 * nn - 2 * ew) * Mpl1 / (2 * m * nn - ew * (m + nn)) : 4 * Mpl1 / m;   // method 2 (with e_w) or method 1
      F2 = (2 * Mpl2 + nn * sFt) / (m + nn);
    } else { F1 = 2 * Mpl1 / m; F2 = Infinity; }
    const F3 = sFt, F = Math.min(F1, F2, F3);
    return { F1, F2, F3, F, mode: F === F1 ? (prying ? 1 : '1-2') : F === F2 ? 2 : 3, Mpl1, Mpl2, n: nn };
  }

  // ---------- effective lengths of a column of bolt rows (T-stub terms), unstiffened flange / plate, EN 1993-1-8 Table 6.4 / 6.6 ----------
  // m, e (edge distance across), e1 (end distance from the outer rows to a free edge along the rows; Infinity if none), p, nr rows.
  // Returns the lesser of the group and the sum of individual rows for mode 1 (min of circular and non-circular) and mode 2 (non-circular).
  function leffRows({ m, e, e1 = Infinity, p = 0, nr }) {
    const indCp = Math.min(2 * Math.PI * m, Math.PI * m + 2 * e1), indNc = Math.min(4 * m + 1.25 * e, 2 * m + 0.625 * e + e1);
    const inCp = 2 * Math.PI * m, inNc = 4 * m + 1.25 * e;
    if (nr === 1) return { l1: Math.min(indCp, indNc), l2: indNc, grp: false };
    const sumInd1 = 2 * Math.min(indCp, indNc) + (nr - 2) * Math.min(inCp, inNc), sumInd2 = 2 * indNc + (nr - 2) * inNc;
    const gEndCp = Math.min(Math.PI * m + p, 2 * e1 + p), gEndNc = Math.min(2 * m + 0.625 * e + 0.5 * p, e1 + 0.5 * p);
    const grpCp = 2 * gEndCp + (nr - 2) * 2 * p, grpNc = 2 * gEndNc + (nr - 2) * p;
    return { l1: Math.min(sumInd1, grpCp, grpNc), l2: Math.min(sumInd2, grpNc), grp: true };
  }

  // ---------- fin plate: detailing, supporting element and tying ----------
  /* o: { bolt, n, p1, e1, e2p (plate end distance, beam side), e2w (beam end distance), tp, hp, tw (beam web), aw (leg), plate, beam (mat),
         hb (beam depth), tsup (supporting web or flange thickness), supp (mat), suppWeb (bool), T (tying force, N), V (N) } */
  function finExtra(o) {
    const b = o.bolt, C = [];
    // detailing (P358): ductility of the fin plate relative to the bolt, depth for torsional restraint
    const tmax = (o.plate.grade === 'S275' ? 0.5 : 0.42) * b.d;
    C.push(chk('D1', 'Detailing - Fin Plate Thickness for Ductility', 'P358 fin plate detailing', [`t_p ≤ ${o.plate.grade === 'S275' ? '0.50' : '0.42'} d = ${r1(tmax)} mm so that the plate yields in bearing before the bolts fail in shear`, `t_p = ${o.tp} mm`], tmax, o.tp, 'mm'));
    C.push(chk('D2', 'Detailing - Fin Plate Depth (Torsional Restraint)', 'P358 fin plate detailing', [`h_p ≥ 0.6 h_b = 0.6 × ${o.hb} = ${r1(0.6 * o.hb)} mm for nominal torsional restraint`, `h_p = ${o.hp} mm`], o.hp, 0.6 * o.hb, 'mm'));
    // supporting element: local shear of the supporting web and punching (plate cannot tear the supporting wall)

      C.push(chk('B9', 'Column Web Welds - Shear', 'EN 1993-1-8 4.5.3.3', [`Two welds along the web, L = ${r1(Lw)} mm, a = ${r2(a)} mm: F_w,Rd = a L f_vw,d = ${kN(Fw)} kN`], Fw / 1e3, V / 1e3, 'kN'));
    }
    return { checks: C, fjd, cc, Aeff, NjRd, FT, FC, zT, zC, MjRd, ts, FtEd, Ftb, NRdc, NRdp, FvRd };
  }

  // ---------- RHS / SHS tension splice: bolted end plates, bolts on two opposite sides (T-stubs) ----------
  /* o: { sec: { h, b, t } (bolts beyond the h faces), plate: { t, grade, B (width along b), D (length along h) }, secGrade, bolt, nb (bolts per side),
         m (bolt centre to the RHS face, less 0.8 a sqrt2), e (bolt to plate edge), aw (weld leg), N (tension) } */
  function rhsSplice(o) {
    const s = o.sec, pm = mat(o.plate.grade, o.plate.t), sm = mat(o.secGrade, s.t), b = o.bolt, C = [];
    const Ft = 0.9 * b.fub * b.As / GM2;
    const m = o.m - 0.8 * o.aw * Math.SQRT2, n = Math.min(o.e, 1.25 * m);
    if (!(m > 0)) throw new Error('Splice: the bolts must lie outside the weld (m ≤ 0)');
    // one side is a single cantilever of width B with n_b bolts: the equivalent T-stub (two halves) has l_eff = B/2 (non-circular)
    // and n_b π m (circular, 2πm around each bolt), as for the end-plate extension in Table 6.6
    const lnc = o.plate.B / 2, lcp = o.nb * Math.PI * m;
    const ts = tstub({ leff1: Math.min(lnc, lcp), leff2: lnc, tf: o.plate.t, f: pm.fy, m, n, Ft, nb: o.nb });
    const NRd = 2 * ts.F;
    C.push(chk('1', `End Plates - T-stub (Mode ${ts.mode}), two sides`, 'EN 1993-1-8 6.2.4, Table 6.2', [`m = ${r1(m)} mm, n = min(e, 1.25m) = ${r1(ts.n)} mm, equivalent T-stub l_eff = min(B/2, n_b πm) = ${r1(Math.min(lnc, lcp))} / ${r1(lnc)} mm per side`,
      `F_T,1 = ${kN(ts.F1)}, F_T,2 = ${kN(ts.F2)}, F_T,3 = ${kN(ts.F3)} kN per side; N_Rd = 2 F_T,Rd = ${kN(NRd)} kN`, `Prying is included (modes 1 and 2); bolts ${b.size} ${b.cls}: F_t,Rd = ${kN(Ft)} kN`], NRd / 1e3, o.N / 1e3, 'kN'));
    const A = 2 * (s.h + s.b) * s.t - 4 * s.t * s.t, Npl = A * sm.fy / GM0;
    C.push(chk('2', 'Hollow Section - Tension', 'EN 1993-1-1 6.2.3', [`A ≈ 2(h + b)t − 4t² = ${Math.round(A)} mm² (square corners); N_pl,Rd = A f_y/γ_M0 = ${kN(Npl)} kN`], Npl / 1e3, o.N / 1e3, 'kN'));
    const a = o.aw / Math.SQRT2, Lw = 2 * (s.h + s.b), Fw = a * Lw * Math.min(pm.fu, sm.fu) / (Math.SQRT2 * Math.max(pm.bw, sm.bw) * GM2);
    C.push(chk('3', 'Weld of the Hollow Section to the End Plate', 'EN 1993-1-8 4.5.3.2 (directional, transverse)', [`All-round fillet weld, L = 2(h + b) = ${r1(Lw)} mm, a = ${r2(a)} mm, transverse: F_w,Rd = a L f_u/(√2 β_w γ_M2) = ${kN(Fw)} kN`], Fw / 1e3, o.N / 1e3, 'kN'));
    C.push(chk('4', 'Detailing - Edge and End Distances', 'EN 1993-1-8 Table 3.3', [`e ≥ 1.2 d₀ = ${r1(1.2 * b.d0)} mm; provided e = ${o.e} mm`], o.e, 1.2 * b.d0, 'mm'));
    return { checks: C, ts, NRd, Npl, Fw };
  }

  // ---------- steel to concrete: plate on cast-in headed anchors (BS EN 1992-4) ----------
  /* o: { V (shear, downward), e (eccentricity of V from the concrete face), T (tie / axial tension), rows (nr), p (row pitch), g (gauge, 2 anchors per row),
         plate: { h, t } (plate height; compression at the bottom edge), size, cls ('4.6'|'8.8'), hef, dh, fck, cracked, c1 (edge distance below the
         bottom row, in the direction of the shear; 0 = remote), hMember (member thickness for psi_h,V) } */
  function steelToConcrete(o) {
    const C = [], b = bolt(o.size, o.cls), fuk = b.fub, fyk = { '4.6': 240, '8.8': 640 }[o.cls], n = 2 * o.rows;
    const gMsN = Math.max(1.4, 1.2 * fuk / fyk), gMsV = fuk <= 800 && fyk / fuk <= 0.8 ? Math.max(1.25, fuk / fyk) : 1.5, gMc = 1.5;
    // tension in the anchors: tie shared by all rows + moment V e about the plate bottom edge, linear with the distance of each row
    const zs = Array.from({ length: o.rows }, (_, i) => o.plate.h / 2 + ((o.rows - 1) / 2 - i) * o.p);   // row heights above the bottom edge, top first
    if (zs[zs.length - 1] <= 0) throw new Error('Anchor rows must lie within the plate');
    const M = o.V * o.e, sz2 = zs.reduce((a, z) => a + z * z, 0);
    const rowT = zs.map(z => o.T / o.rows + M * z / sz2), NEdTop = Math.max(...rowT) / 2, NEdGrp = rowT.reduce((a, t) => a + Math.max(0, t), 0);
    const NRds = b.As * fuk / gMsN, VRds = (fuk <= 500 ? 0.6 : 0.5) * b.As * fuk / gMsV;
    const VEd1 = o.V / n;
    C.push(chk('A1', 'Anchors - Steel Failure (tension + shear)', 'BS EN 1992-4 7.2.1.3, 7.2.2.3, 7.2.3', [`N_Rk,s = A_s f_uk; γ_Ms,N = max(1.4, 1.2 f_uk/f_yk) = ${r2(gMsN)}: N_Rd,s = ${kN(NRds)} kN`,
      `V_Rk,s = k₆ A_s f_uk (k₆ = ${fuk <= 500 ? 0.6 : 0.5}); γ_Ms,V = ${r2(gMsV)}: V_Rd,s = ${kN(VRds)} kN (no lever arm: plate clamped to the concrete)`,
      `most loaded anchor N_Ed = ${kN(NEdTop)} kN, V_Ed = ${kN(VEd1)} kN; (N/N_Rd)² + (V/V_Rd)² = ${r2((NEdTop / NRds) ** 2 + (VEd1 / VRds) ** 2)}`], 1, (NEdTop / NRds) ** 2 + (VEd1 / VRds) ** 2, '-'));
    // concrete cone for the anchors in tension (rows with T > 0), pull-out per anchor
    const tensRows = rowT.filter(t => t > 1e-9).length, hef = o.hef, scr = 3 * hef, ccr = 1.5 * hef, k1 = o.cracked ? 8.9 : 12.7;
    const N0 = k1 * Math.sqrt(o.fck) * hef ** 1.5, sx = Math.min(o.g, scr), sy = Math.min(o.p, scr);
    const AcN = (scr + sx) * (scr + Math.max(0, tensRows - 1) * sy), c1N = o.c1 > 0 ? Math.min(o.c1, ccr) : ccr;
    const AcNe = o.c1 > 0 ? (scr + sx) * (ccr + c1N + Math.max(0, tensRows - 1) * sy) : AcN;
    const psiS = Math.min(1, 0.7 + 0.3 * c1N / ccr), psiRe = Math.min(1, 0.5 + hef / 200);
    const NRdc = tensRows ? N0 * Math.min(AcN, AcNe) / (scr * scr) * psiS * psiRe / gMc : Infinity;
    const Ah = Math.PI / 4 * (o.dh * o.dh - b.d * b.d), NRdp = (o.cracked ? 7.5 : 10.5) * Ah * o.fck / gMc;
    C.push(chk('A2', 'Anchors - Concrete Cone (tension group)', 'BS EN 1992-4 7.2.1.4', [`${tensRows} row(s) in tension; N⁰_Rk,c = ${k1} √f_ck h_ef^1.5 = ${kN(N0)} kN; A_c,N/A⁰_c,N = ${r2(Math.min(AcN, AcNe) / (scr * scr))}, ψ_s,N = ${r2(psiS)}, ψ_re,N = ${r2(psiRe)}`,
      `N_Rd,c = ${Number.isFinite(NRdc) ? kN(NRdc) : '∞'} kN against ΣN_Ed = ${kN(NEdGrp)} kN`], Number.isFinite(NRdc) ? NRdc / 1e3 : 1e9, NEdGrp / 1e3, 'kN'));
    C.push(chk('A3', 'Anchors - Pull-out (per anchor)', 'BS EN 1992-4 7.2.1.5', [`N_Rd,p = k₂ A_h f_ck/γ_Mc = ${kN(NRdp)} kN (k₂ = ${o.cracked ? 7.5 : 10.5}, A_h = ${r1(Ah)} mm²)`], NRdp / 1e3, NEdTop / 1e3, 'kN'));
    // pry-out (all anchors), concrete edge (shear towards the edge below, if near)
    const N0all = N0 * ((scr + sx) * (scr + (o.rows - 1) * sy)) / (scr * scr) * psiRe;
    const VRdcp = (hef < 60 ? 1 : 2) * N0all / gMc;
    C.push(chk('A4', 'Anchors - Concrete Pry-out', 'BS EN 1992-4 7.2.2.4', [`V_Rk,cp = k₈ N_Rk,c (whole group, k₈ = ${hef < 60 ? 1 : 2}); V_Rd,cp = ${kN(VRdcp)} kN`], VRdcp / 1e3, o.V / 1e3, 'kN'));
    let VRdc = Infinity, edgeLines = ['No edge in the direction of the shear (c₁ = 0 entered as remote).'];
    if (o.c1 > 0) {
      const c1 = o.c1, lf = Math.min(hef, 12 * b.d), dn = b.d, a = 0.1 * Math.sqrt(lf / c1), bb = 0.1 * (dn / c1) ** 0.2;
      const k9 = o.cracked ? 1.7 : 2.4, V0 = k9 * dn ** a * lf ** bb * Math.sqrt(o.fck) * c1 ** 1.5;
      const hM = o.hMember || 1e9, wV = 1.5 * c1 * 2 + Math.min(o.g, 3 * c1), A0 = 4.5 * c1 * c1, AcV = Math.min(1.5 * c1, hM) * wV;
      const psiH = Math.max(1, Math.sqrt(1.5 * c1 / hM)), psiSV = 1, psiReV = 1;
      VRdc = V0 * AcV / A0 * psiSV * psiH * psiReV / gMc;
      edgeLines = [`V⁰_Rk,c = k₉ d^α l_f^β √f_ck c₁^1.5 = ${kN(V0)} kN (α = ${r2(a)}, β = ${r2(bb)}, l_f = ${r1(lf)} mm, k₉ = ${k9})`,
        `A_c,V/A⁰_c,V = ${r2(AcV / A0)} (front row only, c₁ = ${c1} mm, member ${o.hMember || '∞'} mm), ψ_h,V = ${r2(psiH)}: V_Rd,c = ${kN(VRdc)} kN`];
    }
    C.push(chk('A5', 'Anchors - Concrete Edge Failure (shear)', 'BS EN 1992-4 7.2.2.5', edgeLines, Number.isFinite(VRdc) ? VRdc / 1e3 : 1e9, o.V / 1e3, 'kN'));
    const bN = Math.max(NEdGrp / (Number.isFinite(NRdc) ? NRdc : Infinity), NEdTop / NRdp), bV = Math.max(o.V / VRdcp, Number.isFinite(VRdc) ? o.V / VRdc : 0);
    C.push(chk('A6', 'Anchors - Concrete Interaction', 'BS EN 1992-4 (7.55)', [`β_N = ${r2(bN)}, β_V = ${r2(bV)}: β_N^1.5 + β_V^1.5 = ${r2(bN ** 1.5 + bV ** 1.5)}`], 1, bN ** 1.5 + bV ** 1.5, '-'));
    return { checks: C, rowT, NEdTop, NEdGrp, NRds, VRds, NRdc, NRdp, VRdcp, VRdc, gMsN, gMsV };
  }

  return { GR, mat, BOLTS, bolt, tstub, leffRows, finExtra, endPlateTying, basePlate, rhsSplice, steelToConcrete };
})();

// Notch requirement check (P358 §3 / Table 3.1)
// Returns {required, dn_min, ln_min, note} 
// dn_min = min notch depth, ln_min = min notch length
function notchCheck(beamSec, suppSec){
  if(!beamSec||!suppSec) return null;
  const b=SECTIONS[beamSec], s=SECTIONS[suppSec];
  if(!b||!s) return null;
  // A notch is required if the beam top flange would clash with the supporting member flange
  // Standard notch: dn ≥ tf_supp + r_supp + 5mm clearance (to clear root of supporting flange)
  // Notch length: ln ≥ b_supp/2 + 10mm (to clear supporting flange)
  const dn_min = s.tf + s.r + 5;
  const ln_min = s.b/2 + 10;
  // Notch required if supporting member flange depth > beam flange (i.e. would clash)
  const required = true; // conservative - always flag possibility
  return {required, dn_min: Math.ceil(dn_min), ln_min: Math.ceil(ln_min),
    note:`Notch depth dn ≥ tf,supp+r+5 = ${s.tf}+${s.r}+5 = ${Math.ceil(dn_min)} mm. Length ln ≥ b,supp/2+10 = ${Math.ceil(ln_min)} mm.`};
}

function dimV(x,y1,y2,label,lx){

// I-section: cx=web centre, y=top, d=depth, tf=flange t, tw=web t, bf=flange width
function isec(cx,y,d,tf,tw,bf){
  const hw=bf/2;
  return `<rect x="${cx-hw}" y="${y}" width="${bf}" height="${tf}" ${D.sec}/>
  <rect x="${cx-tw/2}" y="${y+tf}" width="${tw}" height="${d-2*tf}" ${D.web}/>
  <rect x="${cx-hw}" y="${y+d-tf}" width="${bf}" height="${tf}" ${D.sec}/>`;
}
// Rotated I-section (horizontal beam): cy=web centre, x=left, len=length
function isecH(x,cy,len,tf,tw,bf){
  const hw=bf/2;
  return `<rect x="${x}" y="${cy-hw}" width="${len}" height="${tf}" ${D.sec}/>
  <rect x="${x}" y="${cy-tw/2}" width="${len}" height="${tw}" ${D.web}/>
  <rect x="${x}" y="${cy+hw-tf}" width="${len}" height="${tf}" ${D.sec}/>`;
}

function svgStart(w,h){

function diagFin(){
  // Fin Plate connection - SCI P358 §5 elevation.
  // Primary beam (supporting) shown as I-section END-ON: flanges top/bottom,
  // web vertical. Fin plate welded to primary beam web, secondary beam
  // (supported) bolted to fin plate, coming in from the right with top flange
  // notched. Plate is SIZED so top and bottom bolt edge distances are equal.
  const W=620, H=470;
  const s=svgStart(W,H);

  // ─── PRIMARY BEAM (supporting, drawn end-on) ──────────────
  const ccx=100, cbf=160, ctf=20, ctw=14;
  const cFaceX=ccx+cbf/2;                    // right flange face
  const col =
    `<rect x="${ccx-cbf/2}" y="0" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${ccx-ctw/2}" y="${ctf}" width="${ctw}" height="${H-2*ctf}" ${D.web}/>
     <rect x="${ccx-cbf/2}" y="${H-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── BOLT GROUP SIZING (drives plate height) ────────────
  // Plate sized so e1 top = e1 bottom. ph = 2*e1 + (n-1)*p1
  const n=4, e1=40, p1=70, e2p=50;
  const plp=140;                             // plate length (horizontal)
  const ph = 2*e1 + (n-1)*p1;                // plate height = 2*40 + 3*70 = 290

  // ─── SECONDARY BEAM (supported, coming in from right) ────
  // Beam depth must exceed plate + notch + small clearances.
  // Bolt group vertical centre = beam CL, so plate is centred about beam CL.
  const bcy=H/2;                              // beam CL
  const btf=18;
  const ndn=38;                               // top-flange notch depth
  const nln=plp+12;                           // notch length (past plate + 12mm)
  // Beam depth chosen so: notch(38) + 15 gap + plate(290) + 15 gap + bot flange(18)
  const bd = ndn + 15 + ph + 15 + btf;        // = 376
  const btop=bcy-bd/2, bbot=bcy+bd/2;
  const bx=cFaceX;                            // beam FLUSH with primary beam face
  const blen=W-bx-16;
  // Top flange present only past the notch
  const topFlg=`<rect x="${bx+nln}" y="${btop}" width="${blen-nln}" height="${btf}" ${D.sec}/>`;
  // Web: L-shaped outline with the top-flange notch cutout
  const webPoly =
    `<polygon points="
       ${bx},${btop+ndn}
       ${bx+nln},${btop+ndn}
       ${bx+nln},${btop+btf}
       ${bx+blen},${btop+btf}
       ${bx+blen},${bbot-btf}
       ${bx},${bbot-btf}" ${D.web}/>`;
  const botFlg=`<rect x="${bx}" y="${bbot-btf}" width="${blen}" height="${btf}" ${D.sec}/>`;
  // Emphasise notch re-entrant corner
  const notchLine =
    `<polyline points="${bx},${btop+ndn} ${bx+nln},${btop+ndn} ${bx+nln},${btop}"
       fill="none" stroke="#1a1a1a" stroke-width="1.6"/>`;
  const beam = topFlg + webPoly + botFlg + notchLine;

  // ─── FIN PLATE (centred about beam CL, welded to primary beam web) ──
  const ptop = bcy - ph/2;
  const pbot = bcy + ph/2;
  const px   = cFaceX;                        // plate starts at primary beam face
  const plate = `<rect x="${px}" y="${ptop}" width="${plp}" height="${ph}" ${D.plt}/>`;

  // ─── FILLET WELDS (double fillet, both sides, full plate height) ──
  const wld =
    `<line x1="${px}" y1="${ptop}" x2="${px}" y2="${ptop+ph}" stroke="#1a1a1a" stroke-width="3.2"/>
     <polygon points="${px},${ptop} ${px+11},${ptop} ${px},${ptop+11}" ${D.wld}/>
     <polygon points="${px},${ptop+ph} ${px+11},${ptop+ph} ${px},${ptop+ph-11}" ${D.wld}/>`;

  // ─── BOLT GROUP (n = 4, single vertical line) ────────────
  const boltX=px+plp-e2p;
  const bY=[];
  for(let i=0;i<n;i++) bY.push(ptop+e1+i*p1);
  const bolts=bY.map(y=>bolt(boltX,y)).join('');

  // ─── DIMENSIONS ──────────────────────────────────────
  // Right of plate: e1, p1×3, e1, h_p
  let dimsR =
    dimV(px+plp+20, ptop, bY[0], 'e₁', px+plp+32);
  for(let i=0;i<n-1;i++){
    dimsR += dimV(px+plp+20, bY[i], bY[i+1], 'p₁', px+plp+32);
  }
  dimsR +=
    dimV(px+plp+20, bY[n-1], pbot, 'e₁', px+plp+32) +
    dimV(px+plp+62, ptop, pbot, 'h_p', px+plp+76);
  // Below plate: z_p (eccentricity) + e2_p + L_p
  const dimsB =
    dimH(cFaceX, boltX, bbot+34, 'z_p', bbot+46) +
    dimH(boltX, px+plp, bbot+34, 'e₂_p', bbot+46) +
    dimH(px, px+plp, bbot+62, 'L_p', bbot+74);
  // Above: notch d_n (left of beam), l_n (above notch)
  const dimsT =
    dimV(bx-18, btop, btop+ndn, 'd_n', bx-34) +
    dimH(bx, bx+nln, btop-16, 'l_n', btop-4);
  const dims = dimsR + dimsB + dimsT;

  // ─── LABELS & CALLOUTS ───────────────────────────────
  const labs =
    // Primary beam label (above)
    `<text ${D.txt} x="${ccx}" y="${btop/2-6}" text-anchor="middle">Primary beam</text>
     <text ${D.sml} x="${ccx}" y="${btop/2+8}" text-anchor="middle">(supporting)</text>` +
    // Fin plate callout
    `<line x1="${px+plp-8}" y1="${ptop+4}" x2="${px+plp+60}" y2="${btop-36}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${px+plp+64}" y="${btop-40}">Fin plate</text>
     <text ${D.sml} x="${px+plp+64}" y="${btop-28}">t_p × L_p × h_p</text>` +
    // Secondary beam label
    label(bx+blen-8, btop-36, 'Secondary beam', 'end') +
    slabel(bx+blen-8, btop-24, '(supported, notched UB)', 'end') +
    // Weld callout
    `<line x1="${px+2}" y1="${ptop+ph*0.5}" x2="${ccx-cbf/2-8}" y2="${H-6}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${ccx-cbf/2-12}" y="${H-20}" text-anchor="end">Double fillet weld,</text>
     <text ${D.sml} x="${ccx-cbf/2-12}" y="${H-8}" text-anchor="end">leg a_w each side</text>` +
    // Notch callout
    `<line x1="${bx+nln}" y1="${btop+ndn-4}" x2="${bx+nln+30}" y2="${btop-50}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${bx+nln+34}" y="${btop-52}">top-flange notch</text>` +
    // Grade note
    `<text ${D.sml} x="${boltX}" y="${bbot+94}" text-anchor="middle">n bolts, Grade 8.8</text>`;

  // ─── APPLIED SHEAR V_Ed (vertical, on beam) ──────────
  const fax = boltX + 200;
  const force =
    `<line x1="${fax}" y1="${bcy-90}" x2="${fax}" y2="${bcy+btf/2}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${fax+10}" y="${bcy-30}">V_Ed</text>`;

  return s + col + beam + plate + wld + bolts + dims + labs + force + '</svg>';
}

function diagPDEP(){
  // Partial Depth End Plate connection - SCI P358 §4.5 elevation.
  // Primary beam (supporting) shown end-on as I-section. End plate welded to
  // SECONDARY beam web only (not flanges - defining feature of PDEP), bolted
  // through the primary beam flange face. Tops of both beams level.
  const W=620, H=440;
  const s=svgStart(W,H);

  // ─── PRIMARY BEAM (supporting, drawn end-on) ──────────────
  const ccx=100, cbf=160, ctf=20, ctw=14;
  const cFaceX=ccx+cbf/2;                    // right flange face
  const col =
    `<rect x="${ccx-cbf/2}" y="0" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${ccx-ctw/2}" y="${ctf}" width="${ctw}" height="${H-2*ctf}" ${D.web}/>
     <rect x="${ccx-cbf/2}" y="${H-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── BOLT GROUP & PLATE SIZING ──────────────────────────
  const n=4, e1=40, p1=60;
  const ph = 2*e1 + (n-1)*p1;                // plate height = 260
  const ptk=14;                               // plate thickness

  // ─── SECONDARY BEAM (coming in from right) ────────────
  // Tops of both beams level: secondary beam top = primary beam top + primary_tf
  const btop = ctf;                           // top of secondary beam = top of primary flange
  const btf=18;
  const bd = ph + 2*15 + btf;                 // plate sits inside flanges with 15mm clearance
  const bbot = btop + bd;
  const bcy = (btop+bbot)/2;
  // End plate sits AGAINST primary beam face (between column & beam end)
  const px = cFaceX;                          // plate starts at primary beam face
  const bx = cFaceX + ptk;                    // secondary beam starts after plate
  const blen = W-bx-16;
  // Secondary beam (full elevation)
  const topFlg=`<rect x="${bx}" y="${btop}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const botFlg=`<rect x="${bx}" y="${bbot-btf}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const web    =`<rect x="${bx}" y="${btop+btf}" width="${blen}" height="${bd-2*btf}" ${D.web}/>`;
  const beam = topFlg + web + botFlg;

  // ─── END PLATE (partial depth - sits between flanges) ──
  const ptop=btop+btf+15, pbot=bbot-btf-15;
  const plate=`<rect x="${px}" y="${ptop}" width="${ptk}" height="${ph}" ${D.plt}/>`;

  // ─── FILLET WELDS (plate to beam web only) ────────────
  // Weld is on the RIGHT face of the plate (against beam web).
  const wwx=cFaceX+ptk;
  const wld =
    weldTri(wwx, ptop, ptop+ph, 1) +
    weldTri(wwx, ptop, ptop+ph,-1);

  // ─── BOLTS (through plate AND primary beam flange) ────
  const boltX = cFaceX + ptk/2;               // bolt CL at plate centre
  const bY=[];
  for(let i=0;i<n;i++) bY.push(ptop+e1+i*p1);
  const bolts=bY.map(y=>bolt(boltX,y)).join('');

  // ─── DIMENSIONS ──────────────────────────────────────
  let dimsR =
    dimV(bx+blen+20, ptop, bY[0], 'e₁', bx+blen+32);
  for(let i=0;i<n-1;i++){
    dimsR += dimV(bx+blen+20, bY[i], bY[i+1], 'p₁', bx+blen+32);
  }
  dimsR +=
    dimV(bx+blen+20, bY[n-1], pbot, 'e₁', bx+blen+32) +
    dimV(bx+blen+64, ptop, pbot, 'h_p', bx+blen+78);
  // Plate thickness
  const dimsT = dimV(bx+blen+20, btop, btop+btf, 't_f', bx+blen+34);

  // ─── LABELS & CALLOUTS ───────────────────────────────
  const labs =
    // Primary beam label - in clear area LEFT of secondary beam, below primary beam top flange
    `<text ${D.txt} x="${ccx}" y="${bbot+60}" text-anchor="middle">Primary beam</text>
     <text ${D.sml} x="${ccx}" y="${bbot+74}" text-anchor="middle">(supporting)</text>` +
    // Secondary beam label - below beam, right side
    `<text ${D.txt} x="${bx+blen-10}" y="${bbot+60}" text-anchor="end">Secondary beam</text>
     <text ${D.sml} x="${bx+blen-10}" y="${bbot+74}" text-anchor="end">(supported)</text>` +
    // End plate callout
    `<line x1="${px+ptk-2}" y1="${ptop-4}" x2="${px+ptk+50}" y2="${btop+btf+4}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${px+ptk+54}" y="${btop+btf+8}">End plate (partial depth)</text>` +
    // Weld callout
    `<line x1="${wwx+8}" y1="${bcy}" x2="${bx+blen-120}" y2="${bbot+30}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${bx+blen-116}" y="${bbot+33}">Double fillet weld, to beam web only</text>` +
    // Grade note
    `<text ${D.sml} x="${boltX}" y="${bbot+100}" text-anchor="middle">n bolts, Grade 8.8</text>` +
    // "Tops level" note - use a horizontal leader to the join
    `<line x1="${cFaceX+10}" y1="${btop-2}" x2="${cFaceX+140}" y2="${btop-22}" stroke="#3366aa" stroke-width="0.7"/>
     <text ${D.sml} x="${cFaceX+144}" y="${btop-24}" style="fill:#3366aa">Tops of both beams level</text>`;

  // ─── APPLIED SHEAR V_Ed ──────────────────────────────
  const fax=bx+blen-200;
  const force =
    `<line x1="${fax}" y1="${bcy-80}" x2="${fax}" y2="${bcy+btf/2}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${fax+10}" y="${bcy-20}">V_Ed</text>`;

  return s + col + beam + plate + wld + bolts + dimsR + dimsT + labs + force + '</svg>';
}

function diagFDEP(){
  // Full Depth End Plate connection - SCI P358 §4.7 elevation.
  // Full-depth plate welded to web AND both flanges of the secondary beam,
  // then bolted through primary beam flange face.
  const W=640, H=440;
  const s=svgStart(W,H);

  // ─── PRIMARY BEAM (supporting, end-on) ──────────────────
  const ccx=100, cbf=160, ctf=20, ctw=14;
  const cFaceX=ccx+cbf/2;
  const col =
    `<rect x="${ccx-cbf/2}" y="0" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${ccx-ctw/2}" y="${ctf}" width="${ctw}" height="${H-2*ctf}" ${D.web}/>
     <rect x="${ccx-cbf/2}" y="${H-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── SECONDARY BEAM + PLATE ─────────────────────────────
  const bcy=H/2, bd=280, btf=20;
  const btop=bcy-bd/2, bbot=bcy+bd/2;
  const ptk=16, px=cFaceX;                   // plate on RIGHT of primary beam face
  const bx=cFaceX+ptk;                       // beam starts AFTER plate
  const blen=W-bx-16;
  const topFlg=`<rect x="${bx}" y="${btop}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const botFlg=`<rect x="${bx}" y="${bbot-btf}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const web    =`<rect x="${bx}" y="${btop+btf}" width="${blen}" height="${bd-2*btf}" ${D.web}/>`;
  const plate=`<rect x="${px}" y="${btop}" width="${ptk}" height="${bd}" ${D.plt}/>`;

  // ─── WELDS ──────────────────────────────────────────
  // Web weld on RIGHT face of plate, between flanges
  const wwx=px+ptk;
  const wldWeb = weldTri(wwx, btop+btf, bbot-btf, 1) +
                 weldTri(wwx, btop+btf, bbot-btf,-1);
  // Flange welds - along beam flange inner face, next to plate
  const fwLen=70;
  const wldFlg = weldH(wwx, wwx+fwLen, btop+btf,-1) +
                 weldH(wwx, wwx+fwLen, bbot-btf, 1);

  // ─── BOLTS (4 off, 2 above + 2 below CL) ───────────
  const e1=40, p1=70;
  const boltX=px+ptk/2;
  const bY=[btop+e1, btop+e1+p1, bbot-e1-p1, bbot-e1];
  const bolts=bY.map(y=>bolt(boltX,y)).join('');

  // ─── DIMENSIONS ───────────────────────────────────
  const dimsR =
    dimV(bx+blen+20, btop, bY[0], 'e₁', bx+blen+32) +
    dimV(bx+blen+20, bY[0], bY[1], 'p₁', bx+blen+32) +
    dimV(bx+blen+20, bY[1], bY[2], 'p', bx+blen+32) +
    dimV(bx+blen+20, bY[2], bY[3], 'p₁', bx+blen+32) +
    dimV(bx+blen+20, bY[3], bbot, 'e₁', bx+blen+32) +
    dimV(bx+blen+64, btop, bbot, 'h_p = d', bx+blen+84);

  // ─── LABELS & CALLOUTS ───────────────────────────
  const labs =
    `<text ${D.txt} x="${ccx}" y="${bbot+60}" text-anchor="middle">Primary beam</text>
     <text ${D.sml} x="${ccx}" y="${bbot+74}" text-anchor="middle">(supporting)</text>` +
    `<text ${D.txt} x="${bx+blen-10}" y="${bbot+60}" text-anchor="end">Secondary beam</text>
     <text ${D.sml} x="${bx+blen-10}" y="${bbot+74}" text-anchor="end">(supported)</text>` +
    // End plate callout
    `<line x1="${px+ptk-2}" y1="${btop+bd*0.28}" x2="${px+ptk+80}" y2="${btop+bd*0.15}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${px+ptk+84}" y="${btop+bd*0.15+4}">End plate (full depth)</text>` +
    // Web weld callout
    `<line x1="${wwx+4}" y1="${bcy}" x2="${wwx+100}" y2="${bcy+40}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${wwx+104}" y="${bcy+44}">Web weld (both sides)</text>` +
    // Flange weld callout
    `<line x1="${wwx+fwLen/2}" y1="${btop+btf+2}" x2="${wwx+fwLen+50}" y2="${btop-26}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${wwx+fwLen+54}" y="${btop-28}">Flange weld</text>` +
    `<text ${D.sml} x="${boltX+140}" y="${bbot+100}" text-anchor="middle">4 bolts, Grade 8.8</text>`;

  // ─── APPLIED SHEAR V_Ed ─────────────────────────
  const fax=bx+blen-130;
  const force =
    `<line x1="${fax}" y1="${bcy-110}" x2="${fax}" y2="${bcy+btf/2}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${fax+10}" y="${bcy-30}">V_Ed</text>`;

  return s + col + topFlg + web + botFlg + plate + wldWeb + wldFlg + bolts +
         dimsR + labs + force + '</svg>';
}

function diagCleat(){
  // Double Angle Cleat - pure ELEVATION view (per reference drawing).
  // Primary beam (supporting) drawn end-on as I-section. Cleats seen edge-on
  // as two thin vertical rectangles (outstanding leg + web leg edge). The
  // two bolt columns (support bolts + web bolts) are the main features.
  // Secondary beam behind, notched top flange. Not covered by P358.
  const W=620, H=460;
  const s=svgStart(W,H);

  // ─── PRIMARY BEAM (end-on) ─────────────────────────────
  const ccx=100, cbf=160, ctf=20, ctw=14;
  const cFaceX=ccx+cbf/2;
  const col =
    `<rect x="${ccx-cbf/2}" y="0" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${ccx-ctw/2}" y="${ctf}" width="${ctw}" height="${H-2*ctf}" ${D.web}/>
     <rect x="${ccx-cbf/2}" y="${H-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── CLEAT & BOLT SIZING ─────────────────────────────
  // Reference shows 4 support bolts + 4 web bolts at same vertical positions
  const n=4, e1=35, p1=55;
  const Lout = 2*e1 + (n-1)*p1;              // cleat length = 235
  const bcy = H/2;
  const cTop = bcy - Lout/2;
  const cBot = bcy + Lout/2;
  const tc = 10;                              // cleat thickness in elevation

  // ─── SECONDARY BEAM (behind, notched) ────────────────
  const btf=18;
  const ndn=32;                               // top-flange notch depth
  const bd = Lout + 2*25 + btf;               // ensure cleats fit with clearance
  const btop=bcy-bd/2, bbot=bcy+bd/2;
  const bx=cFaceX;                            // beam flush with primary beam
  const blen=W-bx-16;
  const cleatLen = 55;                        // web-leg length (horizontal extent)
  const nln = cleatLen + 20;                  // notch length just past cleats
  // Beam web outline with top-flange notch
  const webPoly =
    `<polygon points="
       ${bx},${btop+ndn}
       ${bx+nln},${btop+ndn}
       ${bx+nln},${btop+btf}
       ${bx+blen},${btop+btf}
       ${bx+blen},${bbot-btf}
       ${bx},${bbot-btf}" ${D.web}/>`;
  const topFlg=`<rect x="${bx+nln}" y="${btop}" width="${blen-nln}" height="${btf}" ${D.sec}/>`;
  const botFlg=`<rect x="${bx}" y="${bbot-btf}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const notchLine =
    `<polyline points="${bx},${btop+ndn} ${bx+nln},${btop+ndn} ${bx+nln},${btop}"
       fill="none" stroke="#1a1a1a" stroke-width="1.6"/>`;
  const beam = topFlg + webPoly + botFlg + notchLine;

  // ─── CLEAT (elevation: thin rectangle seen edge-on) ───
  // In pure elevation, you see just the edge of the outstanding leg, which is
  // a thin vertical rectangle right at the primary beam face.
  const cleat = `<rect x="${cFaceX}" y="${cTop}" width="${tc}" height="${Lout}" ${D.plt}/>`;

  // ─── TWO BOLT COLUMNS (matches reference) ────────────
  // Support bolts - go through cleat outstanding leg + primary beam flange
  const sbx = cFaceX + tc/2;
  const bY = [];
  for(let i=0;i<n;i++) bY.push(cTop + e1 + i*p1);
  const sbolts = bY.map(y=>bolt(sbx,y)).join('');
  // Web bolts - go through cleat web leg + secondary beam web, offset right
  const wbx = cFaceX + tc + cleatLen - 18;
  const wbolts = bY.map(y=>bolt(wbx,y)).join('');

  // ─── DIMENSIONS ────────────────────────────────────
  let dims =
    dimV(cFaceX-22, cTop, bY[0], 'e₁', cFaceX-34);
  for(let i=0;i<n-1;i++){
    dims += dimV(cFaceX-22, bY[i], bY[i+1], 'p₁', cFaceX-34);
  }
  dims += dimV(cFaceX-22, bY[n-1], cBot, 'e₁', cFaceX-34) +
          dimV(cFaceX-64, cTop, cBot, 'L_cleat', cFaceX-80) +
          dimH(sbx, wbx, bbot+28, 'gauge', bbot+40);

  // ─── LABELS & CALLOUTS ────────────────────────────
  const labs =
    // Primary beam label - below everything in clear area
    `<text ${D.txt} x="${ccx}" y="${H-20}" text-anchor="middle">Primary beam</text>
     <text ${D.sml} x="${ccx}" y="${H-6}" text-anchor="middle">(supporting)</text>` +
    label(bx+blen-8, btop-28, 'Secondary beam', 'end') +
    slabel(bx+blen-8, btop-16, '(notched UB)', 'end') +
    // Cleat callout
    `<line x1="${cFaceX+tc+2}" y1="${cTop+6}" x2="${cFaceX+tc+90}" y2="${btop-22}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${cFaceX+tc+94}" y="${btop-26}">Angle cleats × 2</text>
     <text ${D.sml} x="${cFaceX+tc+94}" y="${btop-14}">(N/S and F/S)</text>` +
    // Support bolts callout - leader going UP-LEFT into clear area above primary beam
    `<line x1="${sbx-6}" y1="${bY[0]}" x2="${sbx-60}" y2="${btop-40}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${sbx-64}" y="${btop-44}" text-anchor="end">support bolts</text>
     <text ${D.sml} x="${sbx-64}" y="${btop-32}" text-anchor="end">(cleats to primary beam)</text>` +
    // Web bolts callout
    `<line x1="${wbx+6}" y1="${bY[n-1]}" x2="${wbx+60}" y2="${bbot+6}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${wbx+64}" y="${bbot+10}">web bolts</text>
     <text ${D.sml} x="${wbx+64}" y="${bbot+22}">(cleats to secondary beam)</text>` +
    // "No site welds" pill
    `<rect x="${bx+blen-130}" y="${bbot+60}" width="120" height="18" rx="3"
       fill="#f0f9f2" stroke="#1a5e28" stroke-width="0.8"/>
     <text ${D.sml} x="${bx+blen-70}" y="${bbot+73}" text-anchor="middle"
       style="fill:#1a5e28;font-weight:600">No site welds</text>`;

  // ─── APPLIED SHEAR V_Ed ────────────────────────
  const fax=bx+blen-200;
  const force =
    `<line x1="${fax}" y1="${bcy-100}" x2="${fax}" y2="${bcy+btf/2}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${fax+10}" y="${bcy-30}">V_Ed</text>`;

  return s + col + beam + cleat + sbolts + wbolts + dims + labs + force + '</svg>';
}

function diagSCleat(){
  // Single Angle Cleat - EC3-1-8 / ECCS Pub.126.
  // Single angle: outstanding leg bolted to column flange, web leg bolted through
  // beam web. Whole connection carries full V_Ed on a single plane - limits
  // capacity vs double cleat. Not covered by P358.
  const W=620, H=460;
  const s=svgStart(W,H);

  // ─── PRIMARY BEAM (end-on) ───────────────────────────
  const ccx=100, cbf=160, ctf=20, ctw=14;
  const cFaceX=ccx+cbf/2;
  const col =
    `<rect x="${ccx-cbf/2}" y="0" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${ccx-ctw/2}" y="${ctf}" width="${ctw}" height="${H-2*ctf}" ${D.web}/>
     <rect x="${ccx-cbf/2}" y="${H-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── CLEAT & BOLT SIZING ────────────────────────────
  const n=4, e1=35, p1=55;
  const Lout = 2*e1 + (n-1)*p1;
  const bcy = H/2;
  const cTop = bcy - Lout/2, cBot = bcy + Lout/2;
  const tc = 10;

  // ─── SECONDARY BEAM ─────────────────────────────────
  const btf=18;
  const ndn=32;
  const bd = Lout + 2*25 + btf;
  const btop=bcy-bd/2, bbot=bcy+bd/2;
  const bx=cFaceX;
  const blen=W-bx-16;
  const cleatLen = 55;
  const nln = cleatLen + 20;
  const webPoly =
    `<polygon points="
       ${bx},${btop+ndn}
       ${bx+nln},${btop+ndn}
       ${bx+nln},${btop+btf}
       ${bx+blen},${btop+btf}
       ${bx+blen},${bbot-btf}
       ${bx},${bbot-btf}" ${D.web}/>`;
  const topFlg=`<rect x="${bx+nln}" y="${btop}" width="${blen-nln}" height="${btf}" ${D.sec}/>`;
  const botFlg=`<rect x="${bx}" y="${bbot-btf}" width="${blen}" height="${btf}" ${D.sec}/>`;
  const notchLine =
    `<polyline points="${bx},${btop+ndn} ${bx+nln},${btop+ndn} ${bx+nln},${btop}"
       fill="none" stroke="#1a1a1a" stroke-width="1.6"/>`;
  const beam = topFlg + webPoly + botFlg + notchLine;

  // ─── SINGLE CLEAT (edge-on in elevation) ────────────
  const cleat = `<rect x="${cFaceX}" y="${cTop}" width="${tc}" height="${Lout}" ${D.plt}/>`;

  // ─── TWO BOLT COLUMNS ──────────────────────────────
  const sbx = cFaceX + tc/2;
  const bY = [];
  for(let i=0;i<n;i++) bY.push(cTop + e1 + i*p1);
  const sbolts = bY.map(y=>bolt(sbx,y)).join('');
  const wbx = cFaceX + tc + cleatLen - 18;
  const wbolts = bY.map(y=>bolt(wbx,y)).join('');

  // ─── DIMENSIONS ────────────────────────────────────
  let dims =
    dimV(cFaceX-22, cTop, bY[0], 'e₁', cFaceX-34);
  for(let i=0;i<n-1;i++){
    dims += dimV(cFaceX-22, bY[i], bY[i+1], 'p₁', cFaceX-34);
  }
  dims += dimV(cFaceX-22, bY[n-1], cBot, 'e₁', cFaceX-34) +
          dimV(cFaceX-64, cTop, cBot, 'L_cleat', cFaceX-80) +
          dimH(sbx, wbx, bbot+28, 'gauge', bbot+40);

  // ─── LABELS & CALLOUTS ────────────────────────────
  const labs =
    `<text ${D.txt} x="${ccx}" y="${H-20}" text-anchor="middle">Primary beam</text>
     <text ${D.sml} x="${ccx}" y="${H-6}" text-anchor="middle">(supporting)</text>` +
    label(bx+blen-8, btop-28, 'Secondary beam', 'end') +
    slabel(bx+blen-8, btop-16, '(notched UB)', 'end') +
    `<line x1="${cFaceX+tc+2}" y1="${cTop+6}" x2="${cFaceX+tc+90}" y2="${btop-22}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${cFaceX+tc+94}" y="${btop-26}">Single angle cleat</text>
     <text ${D.sml} x="${cFaceX+tc+94}" y="${btop-14}">(one side only)</text>` +
    `<line x1="${sbx-6}" y1="${bY[0]}" x2="${sbx-60}" y2="${btop-40}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${sbx-64}" y="${btop-44}" text-anchor="end">support bolts</text>` +
    `<line x1="${wbx+6}" y1="${bY[n-1]}" x2="${wbx+60}" y2="${bbot+6}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${wbx+64}" y="${bbot+10}">web bolts</text>` +
    // Capacity warning pill
    `<rect x="${bx+blen-170}" y="${bbot+60}" width="160" height="18" rx="3"
       fill="#fff8ed" stroke="#c47a0a" stroke-width="0.8"/>
     <text ${D.sml} x="${bx+blen-90}" y="${bbot+73}" text-anchor="middle"
       style="fill:#c47a0a;font-weight:600">Full V on one cleat</text>`;

  // ─── APPLIED SHEAR V_Ed ─────────────────────────
  // ─── APPLIED SHEAR V_Ed ─────────────────────────
  const fax=bx+blen-190;
  const force =
    `<line x1="${fax}" y1="${bcy-100}" x2="${fax}" y2="${bcy+btf/2}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${fax+10}" y="${bcy-30}">V_Ed</text>`;

  return s + col + beam + cleat + sbolts + wbolts + dims + labs + force + '</svg>';
}

function diagSplice(){
  // Column Splice - SCI P358 §6 ELEVATION looking at the column web side.
  // Column runs vertically. Bearing interface at mid-height (thin horizontal
  // gap). Flange cover plates visible as thin strips on LEFT & RIGHT of the
  // column body; Web cover plate visible as a wider plate on the column CL.
  // Break lines top and bottom indicate column continues.
  const W=580, H=520;
  const s=svgStart(W,H);

  // ─── COLUMN BODY (as seen on web face - flange depth × height) ──
  // "Column depth" = horizontal extent (flange-to-flange); flanges seen at
  // the left and right edges as thin vertical strips.
  const cx=W/2;
  const cWidth=160;                          // flange depth (horizontal extent)
  const ctf=16;                              // flange width (seen edge-on, thin)
  const cLeft=cx-cWidth/2, cRight=cx+cWidth/2;
  const colTop=40, colBot=H-40;
  const gap=12;                              // bearing gap at mid-height
  const midY=H/2;
  const upBot=midY-gap/2, loTop=midY+gap/2;

  // Column body - draw as solid rectangles (upper + lower, with flanges darker)
  const colUpper =
    `<rect x="${cLeft}" y="${colTop}" width="${cWidth}" height="${upBot-colTop}" ${D.web}/>
     <rect x="${cLeft}" y="${colTop}" width="${ctf}" height="${upBot-colTop}" ${D.sec}/>
     <rect x="${cRight-ctf}" y="${colTop}" width="${ctf}" height="${upBot-colTop}" ${D.sec}/>`;
  const colLower =
    `<rect x="${cLeft}" y="${loTop}" width="${cWidth}" height="${colBot-loTop}" ${D.web}/>
     <rect x="${cLeft}" y="${loTop}" width="${ctf}" height="${colBot-loTop}" ${D.sec}/>
     <rect x="${cRight-ctf}" y="${loTop}" width="${ctf}" height="${colBot-loTop}" ${D.sec}/>`;

  // ─── BEARING INTERFACE ─────────────────────────────
  const bearing =
    `<line x1="${cLeft-20}" y1="${upBot}" x2="${cRight+20}" y2="${upBot}"
       stroke="#444" stroke-width="1"/>
     <line x1="${cLeft-20}" y1="${loTop}" x2="${cRight+20}" y2="${loTop}"
       stroke="#444" stroke-width="1"/>`;

  // ─── BREAK SYMBOLS at top and bottom of column ─────
  const brk = (y)=>
    `<polyline points="${cLeft},${y} ${cLeft+cWidth*0.2},${y-8} ${cLeft+cWidth*0.4},${y+8} ${cLeft+cWidth*0.6},${y-8} ${cLeft+cWidth*0.8},${y+8} ${cRight},${y}"
      fill="none" stroke="#1a1a1a" stroke-width="1.2"/>`;
  const breaks = brk(colTop) + brk(colBot);

  // ─── WEB COVER PLATE (centre of column, spans bearing gap) ─
  const wph=140, wpw=60;
  const wpy=midY-wph/2;
  const wpx=cx-wpw/2;
  const webPlate=`<rect x="${wpx}" y="${wpy}" width="${wpw}" height="${wph}" ${D.plt}/>`;
  // Web bolts: 2×2 above splice + 2×2 below splice (4 total in 2 columns)
  const wbxL=wpx+14, wbxR=wpx+wpw-14;
  const wbYsT=[midY-50, midY-22];
  const wbYsB=[midY+22, midY+50];
  const webBolts =
    wbYsT.concat(wbYsB).map(y=>bolt(wbxL,y)+bolt(wbxR,y)).join('');

  // ─── FLANGE COVER PLATES (on LEFT and RIGHT column edges) ─
  const fph=wph, fpw=22;
  const fpy=midY-fph/2;
  const fpL=cLeft-fpw/2;                     // straddles left flange
  const fpR=cRight-fpw/2;
  const flgPlates=
    `<rect x="${fpL}" y="${fpy}" width="${fpw}" height="${fph}" ${D.plt}/>
     <rect x="${fpR}" y="${fpy}" width="${fpw}" height="${fph}" ${D.plt}/>`;
  // Flange bolts: 2 above + 2 below on each plate
  const fbxL=fpL+fpw/2, fbxR=fpR+fpw/2;
  const fbYs=[midY-50, midY-22, midY+22, midY+50];
  const flgBolts=fbYs.map(y=>bolt(fbxL,y)+bolt(fbxR,y)).join('');

  // ─── DIMENSIONS ────────────────────────────────
  const dims =
    dimV(cRight+fpw/2+16, upBot, loTop, 'gap', cRight+fpw/2+36) +
    dimV(cRight+fpw/2+50, wpy, wpy+wph, 'L_cp', cRight+fpw/2+70);

  // ─── LABELS & CALLOUTS ───────────────────────
  const labs =
    // Upper / Lower column labels
    `<text ${D.txt} x="${cLeft-80}" y="${colTop+60}" text-anchor="middle">Upper</text>
     <text ${D.txt} x="${cLeft-80}" y="${colTop+76}" text-anchor="middle">column</text>` +
    `<text ${D.txt} x="${cLeft-80}" y="${colBot-76}" text-anchor="middle">Lower</text>
     <text ${D.txt} x="${cLeft-80}" y="${colBot-60}" text-anchor="middle">column</text>` +
    // Web cover plate callout
    `<line x1="${wpx-2}" y1="${wpy+10}" x2="${wpx-38}" y2="${wpy-28}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${wpx-42}" y="${wpy-32}" text-anchor="end">Web cover plate</text>
     <text ${D.sml} x="${wpx-42}" y="${wpy-20}" text-anchor="end">(both sides of web)</text>` +
    // Flange cover plate callout
    `<line x1="${fpR+fpw}" y1="${fpy+20}" x2="${fpR+fpw+40}" y2="${fpy-16}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${fpR+fpw+44}" y="${fpy-20}">Flange cover plate</text>
     <text ${D.sml} x="${fpR+fpw+44}" y="${fpy-8}">(× 4 total, each flange)</text>` +
    // Bearing surface note
    `<line x1="${cLeft-4}" y1="${midY}" x2="${cLeft-40}" y2="${midY+30}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${cLeft-44}" y="${midY+34}" text-anchor="end">bearing surface</text>`;

  // ─── APPLIED FORCES (N, V) ──────────────────
  const force =
    `<line x1="${cx}" y1="${8}" x2="${cx}" y2="${colTop-4}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${cx+8}" y="${colTop-10}">N_Ed</text>` +
    `<line x1="${cRight+120}" y1="${midY}" x2="${cRight+fpw/2+100}" y2="${midY}" stroke="#1a5e28" stroke-width="3" marker-end="url(#arr)"/>
     <text ${D.grn} x="${cRight+124}" y="${midY+5}">V_Ed</text>`;

  return s + colUpper + colLower + bearing + breaks + webPlate + webBolts +
         flgPlates + flgBolts + dims + labs + force + '</svg>';
}

function diagBase(){
  // Column Base connection - SCI P358 §7 elevation.
  // Column welded to base plate via fillet welds, base plate bedded on grout
  // onto a concrete foundation, with holding-down bolts cast into the concrete.
  // Shows cantilever 'c' (P358 effective outstand), base plate thickness t_p,
  // base plate width B_p, grout layer and HD bolts.
  const W=600, H=480;
  const s=svgStart(W,H);

  // ─── COLUMN (UC, sitting above base plate) ─────────────
  const cx=W/2, ctf=18, ctw=14, cbf=130;
  const colTopY=20, colBotY=260;
  const col =
    `<rect x="${cx-cbf/2}" y="${colTopY}" width="${cbf}" height="${ctf}" ${D.sec}/>
     <rect x="${cx-ctw/2}" y="${colTopY+ctf}" width="${ctw}" height="${colBotY-colTopY-2*ctf}" ${D.web}/>
     <rect x="${cx-cbf/2}" y="${colBotY-ctf}" width="${cbf}" height="${ctf}" ${D.sec}/>`;

  // ─── WELDS (fillet welds, column flanges to base plate) ─
  const wldCol =
    weldH(cx-cbf/2, cx-ctw/2, colBotY, 1) +
    weldH(cx+ctw/2, cx+cbf/2, colBotY, 1);

  // ─── BASE PLATE ──────────────────────────────────────
  const bpw=280, bph=20;
  const bpx=cx-bpw/2, bpy=colBotY;
  const basePlate=`<rect x="${bpx}" y="${bpy}" width="${bpw}" height="${bph}" ${D.plt}/>`;

  // ─── GROUT LAYER ────────────────────────────────────
  const grty=bpy+bph, grth=14;
  const grout =
    `<rect x="${bpx-14}" y="${grty}" width="${bpw+28}" height="${grth}"
       fill="#e8e8e8" stroke="#888" stroke-width="0.8" stroke-dasharray="4,2"/>
     <text ${D.sml} x="${cx}" y="${grty+grth/2+3}" text-anchor="middle">grout</text>`;

  // ─── CONCRETE FOUNDATION ───────────────────────────
  const cony=grty+grth, conh=120;
  const conc =
    `<rect x="${bpx-48}" y="${cony}" width="${bpw+96}" height="${conh}" ${D.hat} stroke="#777" stroke-width="1"/>
     <text ${D.sml} x="${cx}" y="${cony+conh/2+3}" text-anchor="middle">Concrete foundation</text>`;

  // ─── HOLDING-DOWN BOLTS (4 off - show 2 in this elevation) ─
  const hdInset=36;
  const hdx1=bpx+hdInset, hdx2=bpx+bpw-hdInset;
  const hdShaftBot=cony+conh-8;
  const hdBolts =
    // Shafts embedded in concrete
    `<line x1="${hdx1}" y1="${bpy}" x2="${hdx1}" y2="${hdShaftBot}" stroke="#444" stroke-width="3"/>
     <line x1="${hdx2}" y1="${bpy}" x2="${hdx2}" y2="${hdShaftBot}" stroke="#444" stroke-width="3"/>` +
    // Anchor (bottom) - horizontal washer plate
    `<rect x="${hdx1-10}" y="${hdShaftBot}" width="20" height="5" fill="#444"/>
     <rect x="${hdx2-10}" y="${hdShaftBot}" width="20" height="5" fill="#444"/>` +
    // Nut + washer at base plate level
    bolt(hdx1, bpy+bph/2, 7) + bolt(hdx2, bpy+bph/2, 7);

  // ─── DIMENSIONS ────────────────────────────────────
  const dims =
    // Cantilever distances left & right of column flange (below base plate)
    dimH(bpx, cx-cbf/2, bpy+bph+34, 'c', bpy+bph+46) +
    dimH(cx+cbf/2, bpx+bpw, bpy+bph+34, 'c', bpy+bph+46) +
    // Overall base plate width (below concrete foundation)
    dimH(bpx, bpx+bpw, cony+conh+22, 'B_p', cony+conh+34) +
    // Base plate thickness (left of plate)
    dimV(bpx-22, bpy, bpy+bph, 't_p', bpx-36) +
    // Grout thickness
    dimV(bpx+bpw+16, grty, grty+grth, '25 grout', bpx+bpw+46);

  // ─── LABELS & CALLOUTS ───────────────────────────
  const labs =
    // Column label - mid-column on the left
    label(cx-cbf/2-90, colTopY+100, 'Column') +
    // Top-of-foundation symbol (▽ level) + label to the right of foundation
    `<polygon points="${bpx+bpw+12},${grty+grth+2} ${bpx+bpw+20},${grty+grth+2} ${bpx+bpw+16},${grty+grth+10}"
       fill="#1a1a1a"/>
     <line x1="${bpx+bpw+2}" y1="${grty+grth+6}" x2="${bpx+bpw+26}" y2="${grty+grth+6}" stroke="#1a1a1a" stroke-width="0.8"/>
     <text ${D.sml} x="${bpx+bpw+30}" y="${grty+grth+9}">top of foundation</text>` +
    // Base plate callout
    `<line x1="${bpx+bpw-20}" y1="${bpy+2}" x2="${bpx+bpw+40}" y2="${bpy-18}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${bpx+bpw+44}" y="${bpy-22}">Base plate</text>` +
    // HD bolt callout
    `<line x1="${hdx1-8}" y1="${cony+40}" x2="${hdx1-60}" y2="${cony+60}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${hdx1-64}" y="${cony+64}" text-anchor="end">HD bolts (cast-in),</text>
     <text ${D.sml} x="${hdx1-64}" y="${cony+76}" text-anchor="end">anchor plate at foot</text>` +
    // Fillet weld callout
    `<line x1="${cx-cbf/2-2}" y1="${colBotY-2}" x2="${cx-cbf/2-50}" y2="${colBotY-30}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${cx-cbf/2-54}" y="${colBotY-34}" text-anchor="end">Fillet weld,</text>
     <text ${D.sml} x="${cx-cbf/2-54}" y="${colBotY-22}" text-anchor="end">leg a_w</text>`;

  return s + col + wldCol + basePlate + grout + conc + hdBolts +
         dims + labs + '</svg>';
}

function diagBrace(){
  // Bracing Connection - per reference drawing.
  // Column (vertical) on LEFT, beam (horizontal) comes in at the TOP from the
  // right and is bolted to the column with 3 bolts through a simple shear
  // connection. Gusset plate sits below the beam bottom flange, welded to the
  // beam bottom flange and column flange, with a chamfered corner where the
  // brace (SHS) attaches. SHS brace bolted to gusset with 4 bolts in 2×2.
  // S.O.P. (Setting Out Point) marked at the intersection of member working
  // lines (column CL × beam CL × brace CL).
  const W=680, H=540;
  const s=svgStart(W,H);

  // ─── COLUMN (vertical, left - simple rectangle w/ break lines) ──
  const ccx=100, cWidth=110;
  const cLeft=ccx-cWidth/2, cRight=ccx+cWidth/2;
  const col =
    `<rect x="${cLeft}" y="0" width="${cWidth}" height="${H}" ${D.web}/>
     <rect x="${cLeft}" y="0" width="14" height="${H}" ${D.sec}/>
     <rect x="${cRight-14}" y="0" width="14" height="${H}" ${D.sec}/>`;
  // Break lines at top & bottom of column
  const brk = (y)=>
    `<polyline points="${cLeft-6},${y} ${cLeft+cWidth*0.25},${y-10} ${cLeft+cWidth*0.5},${y+10} ${cLeft+cWidth*0.75},${y-10} ${cRight+6},${y+4}"
      fill="none" stroke="#1a1a1a" stroke-width="1.2"/>`;
  const breaks = brk(50) + brk(H-50);

  // ─── BEAM (horizontal at TOP, coming in from right) ──
  const btf=18, bd=120;
  const bTop=140, bBot=bTop+bd;
  const bcy=(bTop+bBot)/2;
  const bLeft=cRight;                          // beam flush with column right face
  const bRight=W-30;                           // beam break at right edge
  const topFlg=`<rect x="${bLeft}" y="${bTop}" width="${bRight-bLeft}" height="${btf}" ${D.sec}/>`;
  const botFlg=`<rect x="${bLeft}" y="${bBot-btf}" width="${bRight-bLeft}" height="${btf}" ${D.sec}/>`;
  const bweb   =`<rect x="${bLeft}" y="${bTop+btf}" width="${bRight-bLeft}" height="${bd-2*btf}" ${D.web}/>`;
  // Break line on right end of beam
  const brkB =
    `<polyline points="${bRight-20},${bTop} ${bRight-14},${bcy-8} ${bRight-2},${bcy+8} ${bRight-14},${bBot}"
      fill="none" stroke="#1a1a1a" stroke-width="1.2"/>`;

  // ─── BEAM-TO-COLUMN CONNECTION (3 bolts through column flange) ──
  const bcBoltX = cRight - 7;                  // bolts in column flange centre
  const bcBoltsY = [bTop+25, bcy, bBot-25];
  const bcBolts = bcBoltsY.map(y=>bolt(bcBoltX, y)).join('');

  // ─── SETTING OUT POINT (S.O.P.) at column CL × beam CL ──
  const sopX=ccx, sopY=bcy;
  const sop =
    `<circle cx="${sopX}" cy="${sopY}" r="5" fill="white" stroke="#1a1a1a" stroke-width="1.2"/>
     <line x1="${sopX-7}" y1="${sopY}" x2="${sopX+7}" y2="${sopY}" stroke="#1a1a1a" stroke-width="0.8"/>
     <line x1="${sopX}" y1="${sopY-7}" x2="${sopX}" y2="${sopY+7}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Column CL (dash-dot vertical) through SOP
  const colCL =
    `<line x1="${ccx}" y1="10" x2="${ccx}" y2="${H-10}"
       stroke="#1a1a1a" stroke-width="0.6" stroke-dasharray="16,3,2,3"/>`;
  // Beam CL (dash-dot horizontal) through SOP
  const beamCL =
    `<line x1="${cLeft-10}" y1="${bcy}" x2="${W-6}" y2="${bcy}"
       stroke="#1a1a1a" stroke-width="0.6" stroke-dasharray="16,3,2,3"/>`;

  // ─── GUSSET PLATE (chamfered rectangle below beam) ──
  const gTop = bBot;                           // on beam bottom flange
  const gLeft = cRight;                        // on column right face
  const gBot = gTop + 180;                     // extent below beam
  const gRight = gLeft + 220;
  const chamfer = 100;                          // chamfer on bottom-right corner
  const gusset =
    `<polygon points="
       ${gLeft},${gTop}
       ${gRight},${gTop}
       ${gRight},${gBot-chamfer}
       ${gRight-chamfer},${gBot}
       ${gLeft},${gBot}" ${D.plt}/>`;

  // ─── GUSSET WELDS (along beam bottom flange + along column face) ──
  const wldBeam = weldH(gLeft+8, gRight-8, gTop, -1);
  const wldCol  = weldTri(gLeft, gTop+8, gBot-8, 1);

  // ─── BRACE (SHS at 45°, connects to chamfered corner) ──
  const cosA=Math.SQRT1_2, sinA=Math.SQRT1_2;
  // Chamfer midpoint
  const chamMidX = gRight - chamfer/2;
  const chamMidY = gBot - chamfer/2;
  // Brace axis: passes through SOP at 45° down-right
  // Start brace from just inside chamfer face, extend down-right
  const axDX = cosA, axDY = sinA;             // axis unit vector (down-right)
  const pDX  = -sinA, pDY = cosA;             // perpendicular
  const brW=40;                                // SHS size (as drawn)
  const brLen=160;                             // length shown
  // Start brace on chamfer face, extend down-right
  const bsX = chamMidX, bsY = chamMidY;
  const beX = bsX + brLen*axDX;
  const beY = bsY + brLen*axDY;
  const bp1x = bsX + pDX*brW/2, bp1y = bsY + pDY*brW/2;
  const bp2x = bsX - pDX*brW/2, bp2y = bsY - pDY*brW/2;
  const bp3x = beX - pDX*brW/2, bp3y = beY - pDY*brW/2;
  const bp4x = beX + pDX*brW/2, bp4y = beY + pDY*brW/2;
  const brace =
    `<polygon points="${bp1x},${bp1y} ${bp2x},${bp2y} ${bp3x},${bp3y} ${bp4x},${bp4y}" ${D.sec}/>`;
  // Break line on brace far end
  const brkBrace =
    `<polyline points="${beX-8*axDX+10*pDX},${beY-8*axDY+10*pDY} ${beX-14*axDX+4*pDX},${beY-14*axDY+4*pDY} ${beX-2*axDX-4*pDX},${beY-2*axDY-4*pDY} ${beX-8*axDX-10*pDX},${beY-8*axDY-10*pDY}"
      fill="none" stroke="#1a1a1a" stroke-width="1.2"/>`;

  // ─── BOLTS: 4 in 2×2 pattern on the gusset (on brace axis) ──
  // Distance along axis from chamfer centre, two rows × two columns (p1 apart)
  const eAx=30, pAx=40, pTr=24;                // edge, along-axis pitch, transverse pitch
  // Bolt positions in gusset: two columns perpendicular to brace axis, two rows along
  const rowsA = [eAx, eAx+pAx];
  const colsT = [-pTr/2, pTr/2];
  const boltPts = [];
  rowsA.forEach(a => colsT.forEach(t => {
    const bx = chamMidX - a*axDX + t*pDX;     // go INTO gusset (opposite brace direction)
    const by = chamMidY - a*axDY + t*pDY;
    boltPts.push([bx,by]);
  }));
  const braceBolts = boltPts.map(([x,y])=>bolt(x,y)).join('');

  // ─── Brace CL (dash-dot, through SOP along brace axis) ──
  const braceCL_len = 360;
  const bcl_x1 = sopX - 60*axDX, bcl_y1 = sopY - 60*axDY;   // upper-left end
  const bcl_x2 = sopX + braceCL_len*axDX, bcl_y2 = sopY + braceCL_len*axDY;
  const braceCLdash =
    `<line x1="${bcl_x1}" y1="${bcl_y1}" x2="${bcl_x2}" y2="${bcl_y2}"
       stroke="#1a1a1a" stroke-width="0.6" stroke-dasharray="16,3,2,3"/>`;

  // ─── DIMENSIONS ────────────────────────────────
  const dims =
    dimH(cRight, gLeft+14, gBot+28, 'Y', gBot+40);

  // ─── LABELS & CALLOUTS ───────────────────────
  const labs =
    // SOP label
    `<line x1="${sopX+8}" y1="${sopY-4}" x2="${sopX-44}" y2="${sopY-44}" stroke="#555" stroke-width="0.7"/>
     <text ${D.sml} x="${sopX-48}" y="${sopY-48}" text-anchor="end" style="font-weight:600">S.O.P.</text>` +
    // Beam label
    `<line x1="${bLeft+90}" y1="${bTop-2}" x2="${bLeft+140}" y2="${bTop-30}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${bLeft+144}" y="${bTop-32}">Beam (per plan)</text>` +
    // Column label
    `<text ${D.txt} x="${ccx}" y="30" text-anchor="middle" style="font-weight:600">Column</text>` +
    // Gusset callout
    `<line x1="${gLeft+40}" y1="${gBot-20}" x2="${gLeft+40}" y2="${gBot+50}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${gLeft+44}" y="${gBot+54}">Gusset plate</text>` +
    // Brace callout - leader from brace side to clear area above-right
    `<line x1="${beX+20*pDX-20*axDX}" y1="${beY+20*pDY-20*axDY}" x2="${W-120}" y2="${H-100}" stroke="#555" stroke-width="0.7"/>
     <text ${D.txt} x="${W-116}" y="${H-100}">SHS bracing</text>
     <text ${D.sml} x="${W-116}" y="${H-88}">(CL OF SHS)</text>`;

  return s + colCL + beamCL + col + breaks +
         topFlg + bweb + botFlg + brkB + bcBolts +
         gusset + wldBeam + wldCol +
         braceCLdash + brace + brkBrace + braceBolts +
         sop + dims + labs + '</svg>';
}

      <div class="iw"><input type="number" id="br-tg" value="10"><span class="unit">mm</span></div></div>
    <div class="field"><label>Gusset depth h_g <em>at weld</em></label>
      <div class="iw"><input type="number" id="br-hg" value="200"><span class="unit">mm</span></div></div>
    <div class="field"><label>Brace thickness t_b <em>flat bar</em></label>
      <div class="iw"><input type="number" id="br-tb" value="10"><span class="unit">mm</span></div></div>
    <div class="field"><label>Brace width w_b</label>
      <div class="iw"><input type="number" id="br-wb" value="90"><span class="unit">mm</span></div></div>
    <div class="field"><label>Eccentricity e <em>bolt CL to weld</em></label>
      <div class="iw"><input type="number" id="br-e" value="60"><span class="unit">mm</span></div></div>
    <div class="field"><label>Weld leg a_w <em>gusset to frame</em></label>
      <div class="iw"><input type="number" id="br-aw" value="8"><span class="unit">mm</span></div></div>
  </div>
  <div class="ibox">e = perpendicular distance from bolt-group centroid to the gusset weld line. Used for in-plane moment on gusset weld.</div>
</div>

    <div class="field"><label>Gusset plate</label><div class="iw"><select id="br-gussGrade">
      <option selected>S275</option><option>S355</option></select></div></div>
